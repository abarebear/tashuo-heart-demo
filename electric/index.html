function momentCard(p){let liked=state.liked.has('moment-'+p.id);return `<article class="section moment-body"><div class="post-header moment-header">${photo(p.photo,'avatar')}<div class="grow"><strong>${escapeHTML(p.name)}</strong><small>${p.when}</small></div>${more()}</div><p class="post-copy" style="margin-top:14px">${escapeHTML(p.text)}</p>${p.image?`<div class="post-visual moment-photo">${photo('sea','','在海边享受假日的示例照片')}<span class="pill">${icon('sun')}生活切片</span></div>`:`<div class="quote-visual"><span class="quote">“</span><p>${p.own?'把小小的开心，<br>留在这里。':'绕一点路，<br>也会收获新的风景。'}</p><span class="small-star">✦</span></div>`}<div class="post-actions"><span class="location" style="color:var(--brand)"># ${escapeHTML(p.tag)}</span><button data-action="like-moment" data-id="${p.id}" aria-label="喜欢这条动态" aria-pressed="${liked}">${icon('heart')}<span>${p.likes+(liked?1:0)}</span></button><button data-action="comment" data-id="${p.id}" aria-label="评论动态">${icon('chat')}</button></div>${p.id==='sea-day'?'<div class="comment-box"><strong>雨水一盒：</strong>隔着屏幕也感受到好天气了。</div>':''}${(state.comments[p.id]||[]).map(text=>`<div class="comment-box"><strong>我：</strong>${escapeHTML(text)}</div>`).join('')}</article>`}

function me(){return topbar('<div class="top-title">我的</div>',`<button class="icon-button" data-action="settings" aria-label="设置">${icon('settings')}</button>`)+`<section class="profile-top"><div class="profile-picture">${photo('owner','','用户示例头像')}<svg class="profile-ring" viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="52" fill="none" stroke="#e6def5" stroke-width="3"/><circle cx="56" cy="56" r="52" fill="none" stroke="#7b5cf5" stroke-width="3" stroke-linecap="round" stroke-dasharray="278 327"/></svg><span class="profile-complete">资料已完成 85%</span></div><h1>${escapeHTML(state.profile.name)}</h1><p class="subtext">${escapeHTML(state.profile.bio)}</p><div class="profile-edit"><button class="secondary" data-action="edit-profile">${icon('edit')}编辑资料</button><button class="secondary" data-action="verification">${icon('shield')}我的认证</button></div></section><section class="section profile-stats"><button data-action="liked-list"><strong>12</strong><span>我喜欢的</span></button><button data-action="likes"><strong style="color:var(--pink)">26</strong><span>喜欢我的</span></button><button data-action="friends"><strong>6</strong><span>新朋友</span></button></section><section class="section" style="padding:12px"><div class="membership"><h2>让每一次心动，<br>看得更清晰。</h2><p>专属筛选，更多认识彼此的可能。</p><button class="text-action" data-action="membership">看看会员专属体验 ${icon('chevron')}</button><span class="corner-heart" aria-hidden="true">♥</span></div></section><section class="section"><div class="weekly"><span class="weekly-score grad-text">88</span><div class="grow"><strong>本周心动周报</strong><p>你的每一次认真，都有被记住。</p><a class="text-action" href="weekly.html">收下这周的小进展 ${icon('chevron')}</a></div><span style="align-self:flex-start;color:var(--pink);font-size:16px">✦</span></div></section><section class="section"><div class="publish-prompt"><span class="inline-icon">${icon('edit')}</span><div class="grow"><strong class="small-title">分享生活的一个小片段</strong><p>让 TA 从日常里，慢慢认识你。</p></div><button class="secondary purple" data-action="publish-moment">去分享</button></div></section><section class="section"><button class="menu-row" data-action="my-events">${icon('bag')}<strong>我的活动</strong><small>${state.eventJoined.size} 场期待</small>${icon('chevron','chevron')}</button><button class="menu-row" data-action="liked-list">${icon('bookmark')}<strong>心动收藏</strong><small>留住有趣的人</small>${icon('chevron','chevron')}</button><button class="menu-row" data-action="story">${icon('heart')}<strong>记录我们的故事</strong><small>小小的开始，也值得</small>${icon('chevron','chevron')}</button><button class="menu-row setting-link" data-action="settings">${icon('settings')}<strong>设置与帮助</strong>${icon('chevron','chevron')}</button></section>`}
const renderers={recommend:recommendation,flight};

function route(){const id=location.hash.slice(1);state.route=renderers[id]?id:'recommend';state.search='';render(true)}
function toast(msg){clearTimeout(toast.timer);$('#toast-region').innerHTML=`<div class="toast">${escapeHTML(msg)}</div>`;toast.timer=setTimeout(()=>$('#toast-region').innerHTML='',2800)}
function openSheet(title,body){if($('#dialog').open)$('#dialog').close();$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=body;$('#dialog').showModal()}
function closeSheet(){$('#dialog').close()}
function openChat(name){if(!state.chats[name])state.chats[name]=[{text:name==='形系星星'?'你好呀，很高兴认识你。最近有什么有趣的小发现吗？':conversations.find(p=>p.name===name)?.text||'你好呀，我们都喜欢看展，想听听你最近的小发现。',me:false}];const list=()=>state.chats[name].map(m=>`<div class="chat-bubble ${m.me?'me':''}">${escapeHTML(m.text)}</div>`).join('');openSheet(name,`<p class="tiny" style="margin-top:0">一句具体的好奇，就是很好的开场。</p><div class="chat-messages" id="chat-messages">${list()}</div><form class="compose-row" id="chat-form"><input name="message" aria-label="聊天内容" placeholder="分享一个今天的小发现…" maxlength="200" required autocomplete="off"><button type="submit">发送</button></form><p class="demo-caption">演示对话，仅保存在本机</p>`);$('#chat-form').onsubmit=e=>{e.preventDefault();const input=e.target.elements.message,text=input.value.trim();if(!text)return;state.chats[name].push({text,me:true});persist();$('#chat-messages').innerHTML=list();input.value='';$('#chat-messages').scrollTop=$('#chat-messages').scrollHeight;conversations.forEach(p=>{if(p.name===name)p.unread=false})}}
function publish(kind){const buddy=kind==='buddy';openSheet(buddy?'发起一个搭子邀请':'留住一个生活切片',`<p style="margin:0">${buddy?'不必想得很完整，一件想一起做的小事就够了。':'不用特别精彩，真实的日常就很可爱。'}</p><form id="publish-form">${buddy?'<label class="field">想一起做什么<input name="title" placeholder="比如：周六去看一场摄影展" maxlength="28" required></label><label class="field">找什么搭子<select name="category"><option>看展</option><option>散步</option><option>咖啡</option><option>运动</option></select></label>':''}<label class="field">${buddy?'说得具体一点':'今天想分享什么'}<textarea name="text" placeholder="${buddy?'什么时候、在哪里，有什么小期待？':'写下一个让你记住的小瞬间…'}" maxlength="280" required></textarea></label><button class="primary" type="submit">${buddy?'发布搭子邀请':'发布我的小日常'}</button><p class="demo-caption">交互演示，内容仅保存在本机</p></form>`);$('#publish-form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),text=fd.get('text').trim();if(!text)return;const id='local-'+Date.now();if(buddy){const title=fd.get('title').trim();if(!title)return;state.posts.unshift({id,name:state.profile.name,photo:'owner',when:'刚刚',category:fd.get('category'),title,text,location:'上海',tag:'时间一起商量',likes:0,own:true});state.buddyFilter='全部';state.buddyScope='推荐'}else state.moments.unshift({id,name:state.profile.name,photo:'owner',when:'刚刚',text,tag:'日常碎片',likes:0,own:true});persist();closeSheet();location.hash=buddy?'buddies':'moments';render();toast(buddy?'邀请已发布，等一份同频回应':'小日常已留下 ♥')}}
function showEvent(id){const e=eventData.find(x=>x.id===id);if(!e)return;openSheet(e.title,`<div class="row"><span class="event-icon ${e.kind==='glass'?'pink':''}">${icon(e.kind)}</span><div><span class="pill">${e.category}</span><p class="subtext">一场有主持人引导的轻松相遇</p></div></div><div class="event-sheet-facts"><span>${e.date}</span><span>${e.location}</span><span>${e.tags.join(' · ')}</span></div><p>${e.copy}</p><button class="primary" data-action="join-event" data-id="${id}">${state.eventJoined.has(id)?'已报名，期待见面':'收下这场相遇'}</button><p class="demo-caption">报名为本地演示，不产生真实预订或付款</p>`)}

case'my-answer':answer();break;
case'like-moment':{const yes=like('moment-'+id,button),p=[...state.moments,...momentData].find(x=>x.id===id);button.querySelector('span').textContent=p.likes+(yes?1:0);break}
case'comment':openSheet('接住这份日常',`<form id="comment-form"><p style="margin-top:0">试着告诉 TA，哪个小细节打动了你。</p><label class="field">留一句回应<textarea name="comment" placeholder="比如：这片海好舒服，想知道是在哪里…" maxlength="200" required></textarea></label><button class="primary" type="submit">留下回应</button><p class="demo-caption">演示评论，仅保存在本机</p></form>`);$('#comment-form').onsubmit=e=>{e.preventDefault();const text=e.target.elements.comment.value.trim();if(!text)return;(state.comments[id]??=[]).push(text);persist();closeSheet();render();toast('认真回应，也是一种靠近')};break;
case'edit-profile':openSheet('更真实一点的你',`<form id="profile-form"><label class="field">昵称<input name="name" value="${escapeHTML(state.profile.name)}" maxlength="16" required></label><label class="field">一句话介绍自己<textarea name="bio" maxlength="60" required>${escapeHTML(state.profile.bio)}</textarea></label><button class="primary" type="submit">保存这份真实</button></form>`);$('#profile-form').onsubmit=e=>{e.preventDefault();const name=e.target.elements.name.value.trim(),bio=e.target.elements.bio.value.trim();if(!name||!bio)return;state.profile={name,bio};persist();closeSheet();render();toast('资料已保存，很高兴多认识你一点')};break;
case'verification':openSheet('多一点真实，多一点安心',`<div class="event-sheet-facts"><span>实名认证 <b style="color:var(--brand);float:right">已完成</b></span><span>学历认证 <b style="color:var(--brand);float:right">已完成</b></span><span>职业认证 <b style="color:var(--sub);float:right">按你的节奏来</b></span></div><p>真实地展示自己，给彼此一个安心认识的开始。</p><button class="primary" data-close>收好我的真实名片</button>`);break;
case'membership':openSheet('让心动，多一点清晰',`<p style="margin-top:0">在自己的节奏里，拥有更多认识彼此的选择。</p><div class="event-sheet-facts"><span>♥ 看见谁喜欢了你</span><span>✦ 根据共同兴趣，找到同频的 TA</span><span>♥ 收好更多心动，慢慢认识</span></div><div class="locked-preview"><h3 style="margin:0 0 10px">TA 们的真实心意</h3><div class="blur-content"><p>一个刚好也喜欢看展的人，想慢慢认识你。</p></div><div class="unlock-strip">完整心意，等你开启</div></div><p class="tiny">这是会员权益的视觉演示，暂未接入付费服务。</p><button class="primary" data-close>先按自己的节奏探索</button>`);break;
case'liked-list':openSheet('收好的小心动',`<div class="sheet-profile">${photo('xingFace')}<div><strong>形系星星 <small style="font-size:14px">24</small></strong><p class="subtext">设计师 · 也喜欢探索生活</p></div></div><button class="primary" data-action="start-chat" data-name="形系星星">从共同兴趣聊起</button>`);break;
case'friends':location.hash='messages';break;
case'story':openSheet('我们的故事，慢慢写',`<p>最初的一句你好，第一次一起散步，或一个记得很久的小细节，都值得留下。</p><form id="story-form"><label class="field">我想记住的一刻<textarea name="story" placeholder="故事从这里开始…" maxlength="500" required></textarea></label><button class="primary" type="submit">收好这个瞬间</button></form>`);$('#story-form').onsubmit=e=>{e.preventDefault();if(!e.target.elements.story.value.trim())return;try{localStorage.setItem('tashuo-story-electric',e.target.elements.story.value.trim())}catch{}closeSheet();toast('这个瞬间，已经好好收下了')};break;
case'settings':case'notification':openSheet('照顾好自己的节奏',`<p style="margin-top:0">你可以决定，什么时候接住一条新消息。</p><label class="checkline"><input type="checkbox" ${preference(0,true)?'checked':''}>接收新消息提醒</label><label class="checkline"><input type="checkbox" ${preference(1,true)?'checked':''}>周报准备好时告诉我</label><label class="checkline"><input type="checkbox" ${preference(2,false)?'checked':''}>晚间安静一点</label><button class="primary" data-action="save-settings">保存我的偏好</button><p class="demo-caption">仅为原型内的偏好演示</p>`);break;
case'save-settings':try{localStorage.setItem('tashuo-preferences-electric',JSON.stringify($$('#sheet-body input').map(x=>x.checked)))}catch{}closeSheet();toast('已收好你的偏好');break;
}
});
document.addEventListener('input',e=>{if(e.target.id==='message-search'){state.search=e.target.value;$('#message-rows').innerHTML=messageRows()}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const b=$('#dialog').getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)closeSheet()}});
window.addEventListener('hashchange',()=>{if($('#dialog').open)closeSheet();route()});
$('#status-icons').innerHTML=icon('signal')+icon('wifi')+icon('battery');$('[data-close]').innerHTML=icon('close');route();
</script>
</body>
</html>
